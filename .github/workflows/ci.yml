name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test SchoolMaster.Tests/ \
            --no-build \
            --configuration Release \
            --filter "Unit" \
            --logger "trx;LogFileName=unit-results.trx" \
            --results-directory ./test-results

      - name: Run integration tests
        run: |
          dotnet test SchoolMaster.Tests/ \
            --no-build \
            --configuration Release \
            --filter "Integration" \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results
        env:
          # Testcontainers pulls Docker images during the run.
          # ubuntu-latest runners have Docker pre-installed so no extra setup is needed.
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: ./test-results/*.trx
          reporter: dotnet-trx
